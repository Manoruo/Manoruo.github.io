<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Detecting cognitive events from the pupillary response signal using machine learning">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#141033"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa55"/>
      <stop offset="1" stop-color="#a78bfa00"/>
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M210 230 Q300 150 390 230 Q300 310 210 230 Z"/>
    </clipPath>
  </defs>

  <rect width="600" height="600" fill="url(#bg2)"/>

  <!-- faint dot grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="70" cy="70" r="1.7"/><circle cx="160" cy="70" r="1.7"/><circle cx="250" cy="70" r="1.7"/><circle cx="350" cy="70" r="1.7"/><circle cx="440" cy="70" r="1.7"/><circle cx="530" cy="70" r="1.7"/>
    <circle cx="70" cy="160" r="1.7"/><circle cx="160" cy="160" r="1.7"/><circle cx="250" cy="160" r="1.7"/><circle cx="350" cy="160" r="1.7"/><circle cx="440" cy="160" r="1.7"/><circle cx="530" cy="160" r="1.7"/>
    <circle cx="70" cy="250" r="1.7"/><circle cx="160" cy="250" r="1.7"/><circle cx="250" cy="250" r="1.7"/><circle cx="350" cy="250" r="1.7"/><circle cx="440" cy="250" r="1.7"/><circle cx="530" cy="250" r="1.7"/>
    <circle cx="70" cy="350" r="1.7"/><circle cx="160" cy="350" r="1.7"/><circle cx="250" cy="350" r="1.7"/><circle cx="350" cy="350" r="1.7"/><circle cx="440" cy="350" r="1.7"/><circle cx="530" cy="350" r="1.7"/>
    <circle cx="70" cy="440" r="1.7"/><circle cx="160" cy="440" r="1.7"/><circle cx="250" cy="440" r="1.7"/><circle cx="350" cy="440" r="1.7"/><circle cx="440" cy="440" r="1.7"/><circle cx="530" cy="440" r="1.7"/>
    <circle cx="70" cy="530" r="1.7"/><circle cx="160" cy="530" r="1.7"/><circle cx="250" cy="530" r="1.7"/><circle cx="350" cy="530" r="1.7"/><circle cx="440" cy="530" r="1.7"/><circle cx="530" cy="530" r="1.7"/>
  </g>

  <!-- glow + radiating pupillary-response rings behind the eye -->
  <circle cx="300" cy="230" r="175" fill="url(#glowViolet)"/>
  <g fill="none" stroke="#a78bfa">
    <circle cx="300" cy="230" r="110" opacity="0.16"/>
    <circle cx="300" cy="230" r="140" opacity="0.10"/>
    <circle cx="300" cy="230" r="170" opacity="0.06"/>
  </g>

  <!-- eye -->
  <path d="M210 230 Q300 150 390 230 Q300 310 210 230 Z" fill="#0b1030"/>
  <g clip-path="url(#eyeClip)">
    <circle cx="300" cy="230" r="54" fill="url(#iris)"/>
    <circle cx="300" cy="230" r="24" fill="#0a0a18"/>
    <circle cx="285" cy="214" r="7" fill="#ffffff" opacity="0.85"/>
  </g>
  <path d="M210 230 Q300 150 390 230 Q300 310 210 230 Z" fill="none" stroke="#c4b5fd" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- gaze baseline -->
  <line x1="85" y1="470" x2="515" y2="470" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 7"/>

  <!-- pupil-diameter signal with cognitive-event markers -->
  <path d="M85 465 L135 465 L160 405 L185 465 L245 465 L275 378 L305 465 L375 465 L400 418 L425 465 L475 465 L515 465"
        fill="none" stroke="#2dd4bf" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <g>
    <circle cx="160" cy="405" r="10" fill="#5eead4" opacity="0.25"/><circle cx="160" cy="405" r="5" fill="#5eead4"/>
    <circle cx="275" cy="378" r="10" fill="#5eead4" opacity="0.25"/><circle cx="275" cy="378" r="5" fill="#5eead4"/>
    <circle cx="400" cy="418" r="10" fill="#5eead4" opacity="0.25"/><circle cx="400" cy="418" r="5" fill="#5eead4"/>
  </g>
</svg>
