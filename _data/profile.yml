short_bio: >-
  <p>
      I am a third-year Ph.D. student in the Robotics Institute at Carnegie Mellon University (CMU), 
      advised by Dr. Wennie Tabib in the 
      <a href="https://rislab.org/" target="_blank" rel="noopener noreferrer">Resilient Intelligent Systems Lab (RIS Lab)</a>. 
  </p>
  <p>
      My research lies at the intersection of Artificial Intelligence and Robotics, specifically 
      focusing on developing robust autonomous vehicles capable of navigating dynamic environments. 
      As robots are deployed in increasingly complex scenarios to perform challenging tasks, we 
      require data and algorithms that utilize that data efficiently to facilitate their success. 
      To this end, my research investigates how tools like reinforcement learning and differentiable 
      simulation can enable efficient robot learning, with a primary focus on aerial systems.
  </p>


