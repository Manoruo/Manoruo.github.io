short_bio: >-
  <p>
      I am a third-year Ph.D. student in the Robotics Institute at Carnegie Mellon University (CMU), 
      advised by Dr. Wennie Tabib in the 
      <a href="https://rislab.org/" target="_blank" rel="noopener noreferrer">Resilient Intelligent Systems Lab (RIS Lab)</a>. 
  </p>
  <p>
    My research lies at the intersection of <strong>AI and robotic control</strong>,
    focusing on building <strong>autonomous systems</strong> that can operate in complex,
    dynamic settings. Because the world is constantly changing, robots need control
    strategies that can adapt in real time. At the same time, the world is governed
    by known physical laws, and we can leverage this knowledge to help robots make
    better decisions. My work combines <strong>reinforcement learning </strong>  with
    <strong> differentiable physics </strong> to help robots leverage both experience and
    physical prior knowledge for adaptive, efficient, and robust control. While my
    current research focuses on <strong>aerial systems</strong>, my long-term goal is
    to extend these adaptive control methods across different robotic
    platforms, enabling robots to operate safely in the real world and work
    alongside humans to accomplish challenging tasks.
  </p>


